<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f11" />
  <title>Selecionar HQs e livros · Biblioteca HQ</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0f0f11;color:#f8f7f4;font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(100%,460px);padding:28px;border:1px solid #483723;border-radius:24px;background:#1c1714;box-shadow:0 24px 70px #0008}small{color:#fbbf24;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font:700 clamp(28px,7vw,38px)/1.1 Georgia,serif;margin:12px 0}p{color:#c7beb4}label{display:block;margin:24px 0 12px;padding:20px;border:1px dashed #a77a23;border-radius:16px;background:#2b2113;text-align:center;font-weight:700;cursor:pointer}input{display:block;width:100%;margin-top:10px;font-size:14px}a{color:#fbbf24}#status{min-height:44px;color:#fbbf24}button{background:#f9a91c;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main><small>Biblioteca HQ · Estúdio</small><h1>Escolher HQs e livros</h1><p>Esta tela leve guarda os arquivos do celular antes de abrir a revisão. Formatos: PDF, CBR, EPUB e AZW3.</p><label>Selecionar arquivos<input id="pdfs" type="file" accept=".pdf,.cbr,.epub,.azw3,application/pdf,application/epub+zip" multiple /></label><p id="status" role="status"></p><p><a href="/configuracoes">Voltar ao estúdio</a></p></main>
<script>
  const input = document.getElementById('pdfs');
  const status = document.getElementById('status');
  input.addEventListener('change', async () => {
    const files = [...input.files];
    if (!files.length) return;
    status.textContent = `Guardando ${files.length} arquivo(s) neste dispositivo...`;
    try {
      const db = await new Promise((resolve, reject) => {
        const open = indexedDB.open('biblioteca-hq-shared-import-v1', 1);
        open.onupgradeneeded = () => open.result.createObjectStore('files', { keyPath: 'id', autoIncrement: true });
        open.onsuccess = () => resolve(open.result);
        open.onerror = () => reject(open.error);
      });
      for (const file of files) {
        const bytes = new Uint8Array(await file.slice(0, 100).arrayBuffer());
        const ext = file.name.split('.').pop().toLowerCase();
        const text = new TextDecoder().decode(bytes);
        const valid = ext === 'pdf' && text.startsWith('%PDF-') || ext === 'epub' && bytes[0] === 0x50 && bytes[1] === 0x4b || ext === 'cbr' && text.startsWith('Rar!') || ext === 'azw3' && text.slice(60, 68) === 'BOOKMOBI';
        if (!valid) throw new Error(`${file.name} não é um PDF, CBR, EPUB ou AZW3 válido.`);
      }
      await new Promise((resolve, reject) => {
        const tx = db.transaction('files', 'readwrite');
        for (const file of files) tx.objectStore('files').add({ file, addedAt: Date.now() });
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error);
      });
      db.close();
      status.textContent = 'Arquivos guardados. Abrindo a revisão...';
      location.replace('/configuracoes?shared=1');
    } catch (error) { status.textContent = error.message || 'Não foi possível guardar os arquivos. Verifique o espaço livre e tente novamente.'; }
  });
</script></body></html>
