<!doctype html>
<html lang="pt-BR">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Redefina sua senha · Biblioteca HQ</title></head>
  <body style="margin:0;padding:32px 12px;background:#0b0908;color:#f5ede5;font-family:Arial,Helvetica,sans-serif">
    <table role="presentation" style="width:100%;max-width:520px;margin:auto;border-collapse:collapse;border:1px solid #443127;border-radius:20px;background:#191310">
      <tr><td style="padding:32px;text-align:center">
        <img src="https://biblioteca-hq.vercel.app/icon-192.png" width="68" height="68" alt="Biblioteca HQ" style="display:block;margin:0 auto 16px">
        <p style="margin:0 0 8px;color:#ffd521;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Seu universo de leitura</p>
        <h1 style="margin:0 0 18px;color:#fff7ed;font-size:26px;line-height:1.2">Redefina sua senha</h1>
        <p style="margin:0 0 24px;color:#cfc2b8;font-size:15px;line-height:1.6">Recebemos um pedido para criar uma nova senha para sua conta da Biblioteca HQ.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 24px;border-radius:10px;background:#ffd521;color:#1b1209;font-size:15px;font-weight:700;text-decoration:none">Criar nova senha</a>
        <p style="margin:26px 0 0;color:#9e9188;font-size:12px;line-height:1.5">Se você não solicitou a troca, ignore este e-mail. Sua senha atual continuará válida.</p>
      </td></tr>
    </table>
  </body>
</html>
